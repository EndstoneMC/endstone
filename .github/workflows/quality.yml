name: Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'src/**'
      - 'include/**'
      - 'endstone/**'
      - 'plugins/**'
      - 'docker/**'
      - 'tests/**'
      - 'recipes/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'pyproject.toml'
      - '**/pyproject.toml'
      - 'pyrightconfig.json'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.pre-commit-config.yaml'
      - '.cmake-format.yaml'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  format:
    if: github.event_name == 'pull_request'
    name: Check formatting and Python types
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Clang
        uses: ./.github/actions/setup-clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Install Pyright
        run: npm install --global pyright@1.1.411

      - name: Run local checks
        run: pre-commit run --all-files

      - name: Run Pyright on changed files
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              -- '*.py' | grep -E '^(endstone|plugins|scripts|tests|docker)/|^conanfile\.py$' || true
          )
          if ((${#files[@]} == 0)); then
            exit 0
          fi
          pyright --project pyrightconfig.json "${files[@]}"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly static analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Clang
        uses: ./.github/actions/setup-clang

      - name: Install analysis dependencies
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q cppcheck llvm-20-dev libclang-20-dev

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Restore Conan cache
        uses: ./.github/actions/conan-cache/restore

      - name: Set up Conan
        uses: ./.github/actions/setup-conan

      - name: Build IWYU
        shell: bash
        run: |
          iwyu_source="$RUNNER_TEMP/include-what-you-use"
          iwyu_build="$RUNNER_TEMP/include-what-you-use-build"
          git clone --depth 1 --branch 0.24 https://github.com/include-what-you-use/include-what-you-use.git "$iwyu_source"
          cmake -S "$iwyu_source" -B "$iwyu_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-20
          cmake --build "$iwyu_build" --target include-what-you-use --parallel 2
          iwyu_binary="$(find "$iwyu_build" -type f -name include-what-you-use -perm -111 -print -quit)"
          test -n "$iwyu_binary"
          echo "$(dirname "$iwyu_binary")" >> "$GITHUB_PATH"

      - name: Build with CMake
        run: |
          cmake --preset conan-relwithdebinfo -DENDSTONE_GENERATE_STUBS=OFF
          cmake --build --preset conan-relwithdebinfo

      - name: Run full clang-tidy
        shell: bash
        run: |
          clang_tidy_runner="$(command -v run-clang-tidy-20 || command -v run-clang-tidy || find /usr/lib/llvm-20 -name run-clang-tidy.py -type f -print -quit)"
          test -n "$clang_tidy_runner"
          python "$clang_tidy_runner" -p build/RelWithDebInfo -j 2

      - name: Run cppcheck
        shell: bash
        run: |
          cppcheck \
            --project=build/RelWithDebInfo/compile_commands.json \
            --enable=all \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction

      - name: Run include-what-you-use
        shell: bash
        run: |
          python "$RUNNER_TEMP/include-what-you-use/iwyu_tool.py" \
            -p build/RelWithDebInfo \
            -j 2 \
            -- -Xiwyu --error_always
