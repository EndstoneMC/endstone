name: CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths: &code-paths
      - 'src/**'
      - 'include/**'
      - 'endstone/**'
      - 'tests/**'
      - 'recipes/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.cmake-format.yaml'
      - 'pyrightconfig.json'
      - 'codecov.yml'
      - '.conan2/**'
      - '.conanrc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  push:
    branches:
      - main
      - develop
      - v*
    paths: *code-paths

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-2022 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Clang (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-clang

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Restore Conan cache
        uses: ./.github/actions/conan-cache/restore

      - name: Set up Conan
        uses: ./.github/actions/setup-conan

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build with CMake
        run: |
          cmake --preset conan-relwithdebinfo
          cmake --build --preset conan-relwithdebinfo

      - name: Run clang-tidy on changed files
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              -- 'src/**' 'tests/**' | grep -E '\.(c|cc|cpp|cxx)$' || true
          )
          if ((${#files[@]} == 0)); then
            exit 0
          fi
          clang_tidy_diff="$(command -v clang-tidy-diff-20.py || command -v clang-tidy-diff.py || find /usr/lib/llvm-20 -name clang-tidy-diff.py -type f -print -quit)"
          test -n "$clang_tidy_diff"
          git diff -U0 --no-color \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- "${files[@]}" \
            | python "$clang_tidy_diff" -p1 -path build/RelWithDebInfo \
                -clang-tidy-binary clang-tidy-20

      - name: Check generated stubs are up to date
        run: git diff --exit-code -- endstone/

      - name: Run Tests
        run: ctest --preset conan-relwithdebinfo

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Clang (Linux)
        uses: ./.github/actions/setup-clang

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Restore Conan cache
        uses: ./.github/actions/conan-cache/restore

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          install-dependencies: 'false'

      - name: Install dependencies (Endstone=Debug, deps=Release)
        run: conan install . --build=missing -s "&:build_type=Debug"

      - name: Build with CMake
        run: |
          cmake --preset conan-debug -DCODE_COVERAGE=ON -DENDSTONE_GENERATE_STUBS=OFF
          cmake --build --preset conan-debug

      - name: Run Tests
        run: ctest --preset conan-debug

      - name: Generate Coverage Report
        run: |
          pip install gcovr
          gcovr -r . --filter src/endstone_core/ --gcov-executable "llvm-cov gcov" --xml coverage.xml build/Debug

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
