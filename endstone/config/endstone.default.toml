[commands]
# Whether to log commands executed by players, in chat or on signs.
# This currently logs in the format "<playername> issued server command: <command>".
log = true

[settings]
# Allow clients to use their own packs when texturepack-required is true.
# Has no effect if texturepack-required is false.
allow-client-packs = false

[network]
# Whether to also listen on IPv6, using the server-portv6 from server.properties.
# Disabled by default: the server exits when it cannot bind that port, and many
# hosts and containers have no IPv6 at all.
ipv6 = false

# STUN servers used to discover this server's public address when it sits behind
# NAT, such as a Docker bridge on a hosting panel. The Bedrock Dedicated Server
# supports these but never configures any itself, so without them the only address
# offered to a client is the private one and NetherNet clients cannot connect.
# Traffic still goes directly to this server; these are only asked what address it
# appears to come from. Only used when transport is nethernet.
stun-servers = ["stun:stun.l.google.com:19302"]
